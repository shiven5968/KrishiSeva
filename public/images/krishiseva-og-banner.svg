<svg width="1200" height="630" viewBox="0 0 1200 630" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="ogBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080E0B" />
      <stop offset="45%" stop-color="#0B1E14" />
      <stop offset="100%" stop-color="#143422" />
    </linearGradient>
    <linearGradient id="ogAccent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#22C55E" />
      <stop offset="50%" stop-color="#4ADE80" />
      <stop offset="100%" stop-color="#10B981" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCD34D" />
      <stop offset="100%" stop-color="#F59E0B" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="60" result="blur" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#ogBg)" />

  <!-- Ambient Glow -->
  <circle cx="1050" cy="120" r="280" fill="#22C55E" opacity="0.16" filter="url(#glow)" />
  <circle cx="150" cy="550" r="220" fill="#10B981" opacity="0.12" filter="url(#glow)" />

  <!-- Grid texture overlay -->
  <g opacity="0.06" stroke="#FFFFFF" stroke-width="1">
    <line x1="0" y1="90" x2="1200" y2="90" />
    <line x1="0" y1="180" x2="1200" y2="180" />
    <line x1="0" y1="270" x2="1200" y2="270" />
    <line x1="0" y1="360" x2="1200" y2="360" />
    <line x1="0" y1="450" x2="1200" y2="450" />
    <line x1="0" y1="540" x2="1200" y2="540" />
    <line x1="150" y1="0" x2="150" y2="630" />
    <line x1="300" y1="0" x2="300" y2="630" />
    <line x1="450" y1="0" x2="450" y2="630" />
    <line x1="600" y1="0" x2="600" y2="630" />
    <line x1="750" y1="0" x2="750" y2="630" />
    <line x1="900" y1="0" x2="900" y2="630" />
    <line x1="1050" y1="0" x2="1050" y2="630" />
  </g>

  <!-- Header Badge -->
  <g transform="translate(100, 75)">
    <rect width="360" height="42" rx="21" fill="#166534" fill-opacity="0.35" stroke="#22C55E" stroke-opacity="0.5" stroke-width="1.5" />
    <circle cx="24" cy="21" r="6" fill="#4ADE80" />
    <text x="42" y="27" fill="#86EFAC" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="800" letter-spacing="1.5">AGRISTACK &amp; UP BHULEKH INTEGRATED</text>
  </g>

  <!-- Brand Title -->
  <text x="100" y="210" fill="#FFFFFF" font-family="system-ui, -apple-system, sans-serif" font-size="64" font-weight="900" letter-spacing="-1.5">
    KrishiSeva <tspan fill="#4ADE80">|</tspan> <tspan fill="#FCD34D" font-size="52">कृषि सेवा</tspan>
  </text>

  <!-- Subtitle Tagline -->
  <text x="100" y="280" fill="#E2E8F0" font-family="system-ui, -apple-system, sans-serif" font-size="34" font-weight="700">
    On-Demand Agricultural Machinery &amp; Heavy Fleet Radar
  </text>

  <text x="100" y="328" fill="#94A3B8" font-family="system-ui, -apple-system, sans-serif" font-size="22" font-weight="500">
    Tractor, Harvester &amp; Drone rentals dispatched to your GPS field plot in 15 mins.
  </text>

  <!-- Feature Pills -->
  <g transform="translate(100, 385)">
    <!-- Pill 1 -->
    <rect x="0" y="0" width="220" height="54" rx="16" fill="#142F21" stroke="#22C55E" stroke-opacity="0.3" stroke-width="1.5" />
    <text x="24" y="34" fill="#FFFFFF" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="700">🚜 1-Click Tractor Dispatch</text>

    <!-- Pill 2 -->
    <rect x="240" y="0" width="220" height="54" rx="16" fill="#142F21" stroke="#22C55E" stroke-opacity="0.3" stroke-width="1.5" />
    <text x="264" y="34" fill="#FFFFFF" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="700">🌾 UPFR Batai Plot Lock</text>

    <!-- Pill 3 -->
    <rect x="480" y="0" width="240" height="54" rx="16" fill="#142F21" stroke="#22C55E" stroke-opacity="0.3" stroke-width="1.5" />
    <text x="504" y="34" fill="#FFFFFF" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="700">⚡ Dynamic Zone Auto-Rate</text>
  </g>

  <!-- Tractor Illustration Card on Right -->
  <g transform="translate(820, 200)">
    <rect width="280" height="280" rx="40" fill="#0B1E14" stroke="#22C55E" stroke-width="3" filter="url(#glow)" />
    <!-- Sun -->
    <circle cx="210" cy="80" r="32" fill="url(#goldGrad)" opacity="0.9" />
    <!-- Ground furrows -->
    <path d="M 40 210 Q 140 230 240 180" stroke="#4ADE80" stroke-width="5" stroke-linecap="round" fill="none" />
    <path d="M 50 230 Q 150 250 240 200" stroke="#22C55E" stroke-width="6" stroke-linecap="round" fill="none" />
    <!-- Stylized Tractor Icon -->
    <text x="70" y="175" font-size="96">🚜</text>
    <rect x="30" y="240" width="220" height="28" rx="8" fill="#166534" fill-opacity="0.6" />
    <text x="140" y="259" fill="#86EFAC" font-family="system-ui, sans-serif" font-size="12" font-weight="800" text-anchor="middle" letter-spacing="1">100% VERIFIED FLEET</text>
  </g>

  <!-- Bottom Bar -->
  <g transform="translate(100, 520)">
    <line x1="0" y1="0" x2="1000" y2="0" stroke="#334155" stroke-width="1.5" />
    <text x="0" y="40" fill="#10B981" font-family="system-ui, -apple-system, sans-serif" font-size="18" font-weight="800">
      https://krishiseva.in
    </text>
    <text x="1000" y="40" fill="#64748B" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="600" text-anchor="end">
      Kisan CHC Helpline: 1800-KRISHI (Toll-Free)
    </text>
  </g>
</svg>
